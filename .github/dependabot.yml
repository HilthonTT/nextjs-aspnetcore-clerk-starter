version: 2

updates:
  # NuGet versions live in Backend/Directory.Packages.props (central package management).
  - package-ecosystem: nuget
    directory: /Backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"

  - package-ecosystem: npm
    directory: /Frontend/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
      clerk:
        patterns:
          - "@clerk/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
