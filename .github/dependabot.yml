version: 2

updates:
  # NuGet versions live in Backend/Directory.Packages.props (central package management).
  - package-ecosystem: nuget
    directory: /Backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"

  - package-ecosystem: npm
    directory: /Frontend/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
      clerk:
        patterns:
          - "@clerk/*"
    ignore:
      # eslint-config-next 16 bundles eslint-plugin-react, which still calls the
      # context.getFilename() API that ESLint 10 removed — linting crashes with
      # "contextOrFilename.getFilename is not a function". Its declared peer range
      # (eslint >=9.0.0) is too permissive to catch this, so pin the major here and
      # lift it once eslint-config-next supports ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript majors change type-checking behaviour across the whole app.
      # Take them deliberately, not on a weekly PR.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
