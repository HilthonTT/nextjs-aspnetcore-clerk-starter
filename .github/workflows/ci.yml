name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the run still in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ASP.NET Core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # Honours Backend/global.json, so CI and local builds use the same SDK band.
          global-json-file: Backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore CsharpAPIClerk.slnx

      - run: dotnet build CsharpAPIClerk.slnx --no-restore --configuration Release

      - run: dotnet test CsharpAPIClerk.slnx --no-build --configuration Release

      - name: Verify formatting matches .editorconfig
        run: dotnet format CsharpAPIClerk.slnx --verify-no-changes --no-restore

  docker:
    name: API image
    runs-on: ubuntu-latest
    # Only worth building an image once the code it contains compiles.
    needs: backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pull requests build the image to prove the Dockerfile still works, but
      # publish nothing. Only pushes to main produce a package.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/web
    env:
      # Placeholders: the build only needs these to be present, never to be valid.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci
      API_URL: http://localhost:5014
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/web/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      # Informational: a newly published advisory should be visible on the PR without
      # blocking a build that is otherwise fine.
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
